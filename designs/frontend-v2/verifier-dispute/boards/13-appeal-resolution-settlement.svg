ist, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#F7F9FC" text-anchor="start">Finality threshold</text><text x="132" y="766" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#9AA7BD" text-anchor="start">Not reached</text><rect x="1024" y="270" width="512" height="270" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="1052" y="310" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="750" fill="#F7F9FC" text-anchor="start">Participant settlement</text><text x="1052" y="354" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#9AA7BD" text-anchor="start">Outcome</text><text x="1508" y="354" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="750" fill="#74A7FF" text-anchor="end">Inconclusive</text><text x="1052" y="396" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#9AA7BD" text-anchor="start">Stake result</text><text x="1508" y="396" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="750" fill="#F5B942" text-anchor="end">Refund-only when finalized</text><text x="1052" y="438" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#9AA7BD" text-anchor="start">Slashing</text><text x="1508" y="438" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="750" fill="#41D39A" text-anchor="end">None for tie</text><rect x="1052" y="480" width="142" height="28" rx="14" fill="#F4B8601F" stroke="#F4B86055" stroke-width="1"/><text x="1123" y="499" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="middle">Not yet claimable</text><rect x="1024" y="568" width="512" height="300" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="1052" y="608" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="750" fill="#F7F9FC" text-anchor="start">Action boundary</text><text x="1052" y="642" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Appeal controls appear only if the pinned</text><text x="1052" y="670" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">release exposes a compatible function and</text><text x="1052" y="698" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">the wallet is canonically eligible.</text><text x="1052" y="726" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Reward and withdrawal actions wait for</text><text x="1052" y="754" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">canonical finality and allocation events.</text><rect x="1052" y="800" width="204" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="1154" y="828" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Open transaction center</text></svg>