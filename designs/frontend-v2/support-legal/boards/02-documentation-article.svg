<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Documentation article"><defs><linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#4F7CFF"/></linearGradient><radialGradient id="glow"><stop stop-color="#4F7CFF" stop-opacity=".16"/><stop offset="1" stop-color="#070A12" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="1000" fill="#070A12"/><circle cx="1420" cy="170" r="300" fill="url(#glow)"/><rect width="1600" height="88" fill="#0C111C"/><g transform="translate(46 24)"><path fill="url(#signal)" d="M22 0 7 5c-2 1-3 2-3 4v12c0 12 6 22 18 27V29l-8-8 8-8V0Zm4 0 15 5c2 1 3 2 3 4v12c0 12-6 22-18 27V29l8-8-8-8V0Z"/><path fill="#22D3EE" d="m24 17 4 4-4 4-4-4 4-4Z"/><text x="78" y="31" font-family="Geist, Inter, Arial, sans-serif" font-size="19" font-weight="820" fill="#F7F9FC" text-anchor="start">TruthBounty</text></g><text x="930" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">Explore</text><text x="1040" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">How it works</text><text x="1150" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#22D3EE" text-anchor="start">Docs</text><text x="1260" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">Status</text><rect x="1370" y="22" width="170" height="44" rx="10" fill="#4F7CFF" stroke="#4F7CFF" stroke-width="1"/><text x="1455" y="50" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Open app</text><text x="64" y="128" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#22D3EE" text-anchor="start">DOCUMENTATION ARTICLE</text><text x="64" y="170" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="650" fill="#9AA7BD" text-anchor="start">Docs  /  Transactions  /  Recovery</text><text x="64" y="214" font-family="Geist, Inter, Arial, sans-serif" font-size="32" font-weight="820" fill="#F7F9FC" text-anchor="start">Recover a delayed transaction</text><text x="64" y="246" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#9AA7BD" text-anchor="start">Understand submitted, replaced, confirmed, finalized, indexing-delayed and reorged states.</text><rect x="64" y="272" width="78" height="28" rx="14" fill="#4F7CFF1F" stroke="#4F7CFF66" stroke-width="1"/><text x="103" y="291" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#4F7CFF" text-anchor="middle">TB-V2</text><rect x="152" y="272" width="166" height="28" rx="14" fill="#41D39A1F" stroke="#41D39A66" stroke-width="1"/><text x="235" y="291" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#41D39A" text-anchor="middle">Reviewed 09 Oct 2026</text><rect x="328" y="272" width="124" height="28" rx="14" fill="#22D3EE1F" stroke="#22D3EE66" stroke-width="1"/><text x="390" y="291" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#22D3EE" text-anchor="middle">Optimism/EVM</text><rect x="64" y="324" width="244" height="538" rx="14" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="88" y="362" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#9AA7BD" text-anchor="start">ON THIS PAGE</text><text x="88" y="404" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Before you start</text><text x="88" y="447" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">1 · Find the transaction</text><text x="88" y="490" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">2 · Read the canonical state</text><text x="88" y="533" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">3 · Reconcile indexing</text><text x="88" y="576" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Replaced transactions</text><text x="88" y="619" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Reorg recovery</text><text x="88" y="662" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">When to ask for help</text><rect x="336" y="324" width="820" height="538" rx="16" fill="#101522" stroke="#273149" stroke-width="1"/><text x="370" y="370" font-family="Geist, Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#F7F9FC" text-anchor="start">Before you start</text><text x="370" y="408" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Never resubmit only because the interface is delayed. First confirm the</text><text x="370" y="432" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">network, release, wallet account and canonical transaction hash.</text><rect x="370" y="466" width="752" height="76" rx="12" fill="#22D3EE0E" stroke="#22D3EE55" stroke-width="1"/><text x="390" y="495" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#F7F9FC" text-anchor="start">Canonical receipt first</text><text x="390" y="520" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">A successful wallet submission is not final settlement or API indexing.</text><text x="370" y="584" font-family="Geist, Inter, Arial, sans-serif" font-size="17" font-weight="760" fill="#F7F9FC" text-anchor="start">1 · Find the transaction</text><text x="370" y="620" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Open Transaction center and match the exact account, chain and release.</text><text x="370" y="644" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">If the wallet replaced the transaction, follow the replacement hash.</text><text x="370" y="708" font-family="Geist, Inter, Arial, sans-serif" font-size="17" font-weight="760" fill="#F7F9FC" text-anchor="start">2 · Read the canonical state</text><text x="370" y="744" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Submitted → confirmed → finalized are distinct. Reverted and reorged</text><text x="370" y="768" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">states require recovery; indexing delayed does not imply chain failure.</text><rect x="370" y="814" width="156" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="448" y="842" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Previous article</text><rect x="956" y="814" width="156" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="1034" y="842" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Next article</text><rect x="1184" y="324" width="352" height="538" rx="16" fill="#101522" stroke="#273149" stroke-width="1"/><text x="1210" y="364" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="760" fill="#F7F9FC" text-anchor="start">Article details</text><text x="1210" y="404" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#9AA7BD" text-anchor="start">Version</text><text x="1510" y="404" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F7F9FC" text-anchor="end">2.0</text><line x1="1210" y1="421" x2="1510" y2="421" stroke="#273149" stroke-width="1"/><text x="1210" y="452" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#9AA7BD" text-anchor="start">Applies to</text><text x="1510" y="452" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F7F9FC" text-anchor="end">TB-V2</text><line x1="1210" y1="469" x2="1510" y2="469" stroke="#273149" stroke-width="1"/><text x="1210" y="500" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#9AA7BD" text-anchor="start">Source</text><text x="1510" y="500" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#22D3EE" text-anchor="end">UX authority</text><line x1="1210" y1="517" x2="1510" y2="517" stroke="#273149" stroke-width="1"/><rect x="1210" y="548" width="300" height="94" rx="12" fill="#4F7CFF0E" stroke="#4F7CFF55" stroke-width="1"/><text x="1230" y="577" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#F7F9FC" text-anchor="start">Need help?</text><text x="1230" y="602" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Use support with a non-secret transaction hash.</text><text x="1210" y="688" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F7F9FC" text-anchor="start">Was this useful?</text><rect x="1210" y="708" width="94" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="1257" y="736" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Yes</text><rect x="1318" y="708" width="94" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="1365" y="736" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">No</text><text x="1210" y="790" font-family="Geist, Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#9AA7BD" text-anchor="start">Feedback is not a support request.</text><rect x="0" y="934" width="1600" height="66" fill="#0C111C"/><text x="64" y="973" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#9AA7BD" text-anchor="start">TruthBounty V2 · Optimism/EVM · Design authority</text><text x="1080" y="973" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#9AA7BD" text-anchor="start">Docs   Status   Contact   Privacy   Terms   Disclosures</text></svg>