><text x="64" y="176" font-family="Geist, Inter, Arial, sans-serif" font-size="34" font-weight="830" fill="#F7F9FC" text-anchor="start">System support states</text><text x="64" y="210" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#9AA7BD" text-anchor="start">Every failure preserves context, explains the boundary and offers only safe recovery paths.</text><rect x="64" y="260" width="474" height="214" rx="16" fill="#101522" stroke="#273149" stroke-width="1"/><rect x="84" y="280" width="42" height="42" rx="12" fill="#22D3EE18" stroke="#22D3EE55" stroke-width="1"/><text x="105" y="307" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#22D3EE" text-anchor="middle">404</text><text x="142" y="300" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="760" fill="#F7F9FC" text-anchor="start">Resource not found</text><text x="84" y="352" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">The identifier is unknown or no longer</text><text x="84" y="374" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">available in this release.</text><rect x="84" y="412" width="210" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="189" y="440" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Return to exploration</text><rect x="570" y="260" width="474" height="214" rx="16" fill="#101522" stroke="#273149" stroke-width="1"/><rect x="590" y="280" width="42" height="42" rx="12" fill="#F4B86018" stroke="#F4B86055" stroke-width="1"/><text x="611" y="307" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#F4B860" text-anchor="middle">410</text><text x="648" y="300" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="760" fill="#F7F9FC" text-anchor="start">Release retired</text><text x="590" y="352" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">This release is unsupported. No wallet</text><text x="590" y="374" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">request or automatic migration starts.</text><rect x="590" y="412" width="210" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="695" y="440" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Open release guide</text><rect x="1076" y="260" width="474" height="214" rx="16" fill="#101522" stroke="#273149" stroke-width="1"/><rect x="1096" y="280" width="42" height="42" rx="12" fill="#FF6B7A18" stroke="#FF6B7A55" stroke-width="1"/><text x="1117" y="307" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#FF6B7A" text-anchor="middle">503</text><text x="1154" y="300" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="760" fill="#F7F9FC" text-anchor="start">Service unavailable</text><text x="1096" y="352" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Public status reports a dependency</text><text x="1096" y="374" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">failure. Mutations fail closed.</text><rect x="1096" y="412" width="210" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="1201" y="440" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">View service status</text><rect x="64" y="504" width="474" height="214" rx="16" fill="#101522" stroke="#273149" stroke-width="1"/><rect x="84" y="524" width="42" height="42" rx="12" fill="#4F7CFF18" stroke="#4F7CFF55" stroke-width="1"/><text x="105" y="551" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#4F7CFF" text-anchor="middle">⏱</text><text x="142" y="544" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="760" fill="#F7F9FC" text-anchor="start">Planned maintenance</text><text x="84" y="596" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Maintenance window 02:00–03:00 UTC.</text><text x="84" y="618" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Canonical contracts may remain available.</text><rect x="84" y="656" width="210" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="189" y="684" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Read maintenance note</text><rect x="570" y="504" width="474" height="214" rx="16" fill="#101522" stroke="#273149" stroke-width="1"/><rect x="590" y="524" width="42" height="42" rx="12" fill="#9B8AFB18" stroke="#9B8AFB55" stroke-width="1"/><text x="611" y="551" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#9B8AFB" text-anchor="middle">↻</text><text x="648" y="544" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="760" fill="#F7F9FC" text-anchor="start">Stale indexed view</text><text x="590" y="596" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Data freshness is below threshold.</text><text x="590" y="618" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Verify canonical receipts first.</text><rect x="590" y="656" width="210" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="695" y="684" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Open transaction center</text><rect x="1076" y="504" width="474" height="214" rx="16" fill="#101522" stroke="#273149" stroke-width="1"/><rect x="1096" y="524" width="42" height="42" rx="12" fill="#FF6B7A18" stroke="#FF6B7A55" stroke-width="1"/><text x="1117" y="551" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#FF6B7A" text-anchor="middle">⊘</text><text x="1154" y="544" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="760" fill="#F7F9FC" text-anchor="start">Action denied</text><text x="1096" y="596" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Capability, chain or release validation</text><text x="1096" y="618" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">failed. Context is preserved.</text><rect x="1096" y="656" width="210" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="1201" y="684" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Review requirements</text><rect x="64" y="780" width="1472" height="88" rx="12" fill="#FF6B7A0E" stroke="#FF6B7A55" stroke-width="1"/><text x="84" y="809" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#F7F9FC" text-anchor="start">Recovery rule</text><text x="84" y="834" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">No error state may auto-submit, request a signature, switch networks, discard a draft or hide canonical identifiers.</text><rect x="0" y="934" width="1600" height="66" fill="#0C111C"/><text x="64" y="973" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#9AA7BD" text-anchor="start">TruthBounty V2 · Optimism/EVM · 