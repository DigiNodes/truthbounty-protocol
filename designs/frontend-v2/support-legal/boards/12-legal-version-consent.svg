<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Legal document version and consent"><defs><linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#4F7CFF"/></linearGradient><radialGradient id="glow"><stop stop-color="#4F7CFF" stop-opacity=".16"/><stop offset="1" stop-color="#070A12" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="1000" fill="#070A12"/><circle cx="1420" cy="170" r="300" fill="url(#glow)"/><rect width="1600" height="88" fill="#0C111C"/><g transform="translate(46 24)"><path fill="url(#signal)" d="M22 0 7 5c-2 1-3 2-3 4v12c0 12 6 22 18 27V29l-8-8 8-8V0Zm4 0 15 5c2 1 3 2 3 4v12c0 12-6 22-18 27V29l8-8-8-8V0Z"/><path fill="#22D3EE" d="m24 17 4 4-4 4-4-4 4-4Z"/><text x="78" y="31" font-family="Geist, Inter, Arial, sans-serif" font-size="19" font-weight="820" fill="#F7F9FC" text-anchor="start">TruthBounty</text></g><text x="930" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">Explore</text><text x="1040" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">How it works</text><text x="1150" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#22D3EE" text-anchor="start">Docs</text><text x="1260" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">Status</text><rect x="1370" y="22" width="170" height="44" rx="10" fill="#4F7CFF" stroke="#4F7CFF" stroke-width="1"/><text x="1455" y="50" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Open app</text><text x="64" y="128" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#22D3EE" text-anchor="start">LEGAL VERSIONS</text><text x="64" y="176" font-family="Geist, Inter, Arial, sans-serif" font-size="34" font-weight="830" fill="#F7F9FC" text-anchor="start">Legal documents and consent</text><text x="64" y="210" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#9AA7BD" text-anchor="start">Track published versions without confusing wallet signatures, sessions or legal acceptance.</text><rect x="64" y="254" width="930" height="584" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="92" y="296" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#9AA7BD" text-anchor="start">DOCUMENT VERSIONS</text><rect x="92" y="322" width="876" height="70" rx="12" fill="#0C111C" stroke="#273149" stroke-width="1"/><circle cx="112" cy="346" r="6" fill="#F4B860"/><text x="130" y="351" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#F7F9FC" text-anchor="start">Privacy notice · DRAFT-1</text><text x="130" y="373" font-family="Geist, Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#9AA7BD" text-anchor="start">Effective date and operator identity unresolved</text><rect x="822" y="343" width="124" height="28" rx="14" fill="#F4B8601F" stroke="#F4B86066" stroke-width="1"/><text x="884" y="362" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="middle">Review only</text><rect x="92" y="406" width="876" height="70" rx="12" fill="#0C111C" stroke="#273149" stroke-width="1"/><circle cx="112" cy="430" r="6" fill="#F4B860"/><text x="130" y="435" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#F7F9FC" text-anchor="start">Terms of use · DRAFT-1</text><text x="130" y="457" font-family="Geist, Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#9AA7BD" text-anchor="start">Governing law and acceptance mechanism unresolved</text><rect x="822" y="427" width="124" height="28" rx="14" fill="#F4B8601F" stroke="#F4B86066" stroke-width="1"/><text x="884" y="446" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="middle">Review only</text><rect x="92" y="490" width="876" height="70" rx="12" fill="#0C111C" stroke="#273149" stroke-width="1"/><circle cx="112" cy="514" r="6" fill="#4F7CFF"/><text x="130" y="519" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#F7F9FC" text-anchor="start">Risk disclosures · v1.0</text><text x="130" y="541" font-family="Geist, Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#9AA7BD" text-anchor="start">Testnet-specific structural content</text><rect x="822" y="511" width="124" height="28" rx="14" fill="#4F7CFF1F" stroke="#4F7CFF66" stroke-width="1"/><text x="884" y="530" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#4F7CFF" text-anchor="middle">Proposed</text><rect x="92" y="574" width="876" height="70" rx="12" fill="#0C111C" stroke="#273149" stroke-width="1"/><circle cx="112" cy="598" r="6" fill="#FF6B7A"/><text x="130" y="603" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#F7F9FC" text-anchor="start">Security policy · DRAFT-1</text><text x="130" y="625" font-family="Geist, Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#9AA7BD" text-anchor="start">Protected reporting channel unresolved</text><rect x="822" y="595" width="124" height="28" rx="14" fill="#FF6B7A1F" stroke="#FF6B7A66" stroke-width="1"/><text x="884" y="614" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FF6B7A" text-anchor="middle">Unavailable</text><rect x="92" y="680" width="876" height="88" rx="12" fill="#22D3EE0E" stroke="#22D3EE55" stroke-width="1"/><text x="112" y="709" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#F7F9FC" text-anchor="start">Version rule</text><text x="112" y="734" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Material changes show a summary, effective date and previous version before renewed consent.</text><text x="92" y="800" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#9AA7BD" text-anchor="start">No production acceptance is currently required or recorded.</text><rect x="1022" y="254" width="514" height="584" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="1050" y="296" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="780" fill="#F7F9FC" text-anchor="start">Consent state preview</text><rect x="1050" y="326" width="112" height="28" rx="14" fill="#FF6B7A1F" stroke="#FF6B7A66" stroke-width="1"/><text x="1106" y="345" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FF6B7A" text-anchor="middle">Unavailable</text><text x="1050" y="382" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Acceptance controls remain disabled until:</text><text x="1050" y="414" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">• an approved legal version exists;</text><text x="1050" y="446" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">• the operator and jurisdiction are verified;</text><text x="1050" y="478" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">• retention and processor notices are complete;</text><text x="1050" y="510" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">• the recording mechanism is specified;</text><text x="1050" y="542" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">• decline and renewed-consent behavior is approved.</text><rect x="1050" y="608" width="458" height="100" rx="12" fill="#FF6B7A0E" stroke="#FF6B7A55" stroke-width="1"/><text x="1070" y="637" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#F7F9FC" text-anchor="start">Wallet-signature boundary</text><text x="1070" y="662" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">A wallet signature is not legal consent unless intentionally specified and reviewed.</text><rect x="1050" y="752" width="174" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="1137" y="780" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Review document</text><rect x="1238" y="752" width="244" height="44" rx="10" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="1360" y="780" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#9AA7BD" text-anchor="middle">Accept unavailable</text><rect x="0" y="934" width="1600" height="66" fill="#0C111C"/><text x="64" y="973" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#9AA7BD" text-anchor="start">TruthBounty V2 · Optimism/EVM · Design authority</text><text x="1080" y="973" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#9AA7BD" text-anchor="start">Docs   Status   Contact   Privacy   Terms   Disclosures</text></svg>