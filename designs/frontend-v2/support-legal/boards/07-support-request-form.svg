<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Support request form"><defs><linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#4F7CFF"/></linearGradient><radialGradient id="glow"><stop stop-color="#4F7CFF" stop-opacity=".16"/><stop offset="1" stop-color="#070A12" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="1000" fill="#070A12"/><circle cx="1420" cy="170" r="300" fill="url(#glow)"/><rect width="1600" height="88" fill="#0C111C"/><g transform="translate(46 24)"><path fill="url(#signal)" d="M22 0 7 5c-2 1-3 2-3 4v12c0 12 6 22 18 27V29l-8-8 8-8V0Zm4 0 15 5c2 1 3 2 3 4v12c0 12-6 22-18 27V29l8-8-8-8V0Z"/><path fill="#22D3EE" d="m24 17 4 4-4 4-4-4 4-4Z"/><text x="78" y="31" font-family="Geist, Inter, Arial, sans-serif" font-size="19" font-weight="820" fill="#F7F9FC" text-anchor="start">TruthBounty</text></g><text x="930" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">Explore</text><text x="1040" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">How it works</text><text x="1150" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#22D3EE" text-anchor="start">Docs</text><text x="1260" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">Status</text><rect x="1370" y="22" width="170" height="44" rx="10" fill="#4F7CFF" stroke="#4F7CFF" stroke-width="1"/><text x="1455" y="50" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Open app</text><text x="64" y="128" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#22D3EE" text-anchor="start">SUPPORT REQUEST</text><text x="64" y="176" font-family="Geist, Inter, Arial, sans-serif" font-size="34" font-weight="830" fill="#F7F9FC" text-anchor="start">Request technical support</text><text x="64" y="210" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#9AA7BD" text-anchor="start">Provide non-secret references that let maintainers reproduce the interface problem.</text><rect x="64" y="254" width="944" height="600" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="92" y="296" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="780" fill="#F7F9FC" text-anchor="start">Request details</text><text x="92" y="330" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#9AA7BD" text-anchor="start">Category</text><rect x="92" y="344" width="416" height="48" rx="10" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="108" y="374" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#F7F9FC" text-anchor="start">Transaction or indexing</text><text x="536" y="330" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#9AA7BD" text-anchor="start">Contact</text><rect x="536" y="344" width="416" height="48" rx="10" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="552" y="374" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">name@example.com</text><text x="92" y="422" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#9AA7BD" text-anchor="start">Public reference</text><rect x="92" y="436" width="416" height="48" rx="10" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="108" y="466" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#F7F9FC" text-anchor="start">Transaction hash, claim ID or dispute ID</text><text x="536" y="422" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#9AA7BD" text-anchor="start">Release</text><rect x="536" y="436" width="416" height="48" rx="10" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="552" y="466" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#F7F9FC" text-anchor="start">TB-V2 · Optimism Sepolia</text><text x="92" y="528" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#9AA7BD" text-anchor="start">What happened?</text><rect x="92" y="544" width="860" height="118" rx="10" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="110" y="574" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Describe the observed state, expected state and safe reproduction steps.</text><text x="110" y="598" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Do not paste protected evidence, wallet secrets or authentication tokens.</text><rect x="92" y="684" width="860" height="62" rx="10" fill="#F4B8600E" stroke="#F4B86055" stroke-width="1"/><text x="112" y="710" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#F7F9FC" text-anchor="start">□ I removed secrets and understand this request cannot change protocol outcomes.</text><text x="92" y="776" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#9AA7BD" text-anchor="start">Submission endpoint</text><rect x="222" y="762" width="190" height="28" rx="14" fill="#F4B8601F" stroke="#F4B86066" stroke-width="1"/><text x="317" y="781" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="middle">Unavailable until approved</text><rect x="760" y="790" width="192" height="44" rx="10" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="856" y="818" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#9AA7BD" text-anchor="middle">Submit unavailable</text><rect x="1036" y="254" width="500" height="600" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="1064" y="296" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="780" fill="#F7F9FC" text-anchor="start">Before submitting</text><circle cx="1074" cy="342" r="10" fill="#41D39A20" stroke="#41D39A"/><path d="m1070 342 3 3 6-7" fill="none" stroke="#41D39A" stroke-width="2" stroke-linecap="round"/><text x="1100" y="347" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Check the public status page</text><circle cx="1074" cy="392" r="10" fill="#41D39A20" stroke="#41D39A"/><path d="m1070 392 3 3 6-7" fill="none" stroke="#41D39A" stroke-width="2" stroke-linecap="round"/><text x="1100" y="397" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Confirm wallet, chain and release</text><circle cx="1074" cy="442" r="10" fill="#41D39A20" stroke="#41D39A"/><path d="m1070 442 3 3 6-7" fill="none" stroke="#41D39A" stroke-width="2" stroke-linecap="round"/><text x="1100" y="447" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Use the canonical transaction hash</text><circle cx="1074" cy="492" r="10" fill="#41D39A20" stroke="#41D39A"/><path d="m1070 492 3 3 6-7" fill="none" stroke="#41D39A" stroke-width="2" stroke-linecap="round"/><text x="1100" y="497" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Remove query tokens and credentials</text><circle cx="1074" cy="542" r="10" fill="#41D39A20" stroke="#41D39A"/><path d="m1070 542 3 3 6-7" fill="none" stroke="#41D39A" stroke-width="2" stroke-linecap="round"/><text x="1100" y="547" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Keep private evidence private</text><rect x="1064" y="610" width="444" height="100" rx="12" fill="#4F7CFF0E" stroke="#4F7CFF55" stroke-width="1"/><text x="1084" y="639" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#F7F9FC" text-anchor="start">Privacy notice</text><text x="1084" y="664" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Support data requires an approved collection endpoint, retention policy and processor list.</text><rect x="1064" y="730" width="444" height="100" rx="12" fill="#FF6B7A0E" stroke="#FF6B7A55" stroke-width="1"/><text x="1084" y="759" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#F7F9FC" text-anchor="start">Authority boundary</text><text x="1084" y="784" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Support can diagnose; it cannot reverse, edit or settle protocol state.</text><rect x="0" y="934" width="1600" height="66" fill="#0C111C"/><text x="64" y="973" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#9AA7BD" text-anchor="start">TruthBounty V2 · Optimism/EVM · Design authority</text><text x="1080" y="973" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#9AA7BD" text-anchor="start">Docs   Status   Contact   Privacy   Terms   Disclosures</text></svg>