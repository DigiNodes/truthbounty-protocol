<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Terms of use"><defs><linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#4F7CFF"/></linearGradient><radialGradient id="glow"><stop stop-color="#4F7CFF" stop-opacity=".16"/><stop offset="1" stop-color="#070A12" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="1000" fill="#070A12"/><circle cx="1420" cy="170" r="300" fill="url(#glow)"/><rect width="1600" height="88" fill="#0C111C"/><g transform="translate(46 24)"><path fill="url(#signal)" d="M22 0 7 5c-2 1-3 2-3 4v12c0 12 6 22 18 27V29l-8-8 8-8V0Zm4 0 15 5c2 1 3 2 3 4v12c0 12-6 22-18 27V29l8-8-8-8V0Z"/><path fill="#22D3EE" d="m24 17 4 4-4 4-4-4 4-4Z"/><text x="78" y="31" font-family="Geist, Inter, Arial, sans-serif" font-size="19" font-weight="820" fill="#F7F9FC" text-anchor="start">TruthBounty</text></g><text x="930" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">Explore</text><text x="1040" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">How it works</text><text x="1150" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#22D3EE" text-anchor="start">Docs</text><text x="1260" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">Status</text><rect x="1370" y="22" width="170" height="44" rx="10" fill="#4F7CFF" stroke="#4F7CFF" stroke-width="1"/><text x="1455" y="50" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Open app</text><text x="64" y="128" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#22D3EE" text-anchor="start">LEGAL</text><text x="64" y="166" font-family="Geist, Inter, Arial, sans-serif" font-size="34" font-weight="830" fill="#F7F9FC" text-anchor="start">Terms of use</text><rect x="64" y="194" width="220" height="28" rx="14" fill="#F4B8601F" stroke="#F4B86066" stroke-width="1"/><text x="174" y="213" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="middle">Review copy · not legal approval</text><text x="300" y="213" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Version DRAFT-1 · effective date and governing law pending</text><rect x="64" y="258" width="254" height="580" rx="14" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="88" y="296" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#9AA7BD" text-anchor="start">CONTENTS</text><text x="88" y="340" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Eligibility</text><text x="88" y="389" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Wallet responsibility</text><text x="88" y="438" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Acceptable use</text><text x="88" y="487" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Claims and evidence</text><text x="88" y="536" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Staking and rewards</text><text x="88" y="585" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Disputes and outcomes</text><text x="88" y="634" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Third-party services</text><text x="88" y="683" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Availability and liability</text><rect x="346" y="258" width="834" height="580" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="376" y="304" font-family="Geist, Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F7F9FC" text-anchor="start">Participation boundaries</text><rect x="376" y="336" width="776" height="86" rx="12" fill="#22D3EE0E" stroke="#22D3EE55" stroke-width="1"/><text x="396" y="365" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#F7F9FC" text-anchor="start">Wallet responsibility</text><text x="396" y="390" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Users control wallet accounts, signing decisions, gas and recovery. TruthBounty cannot restore keys.</text><rect x="376" y="438" width="776" height="86" rx="12" fill="#4F7CFF0E" stroke="#4F7CFF55" stroke-width="1"/><text x="396" y="467" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#F7F9FC" text-anchor="start">Protocol outcomes</text><text x="396" y="492" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Claims, verification and disputes follow contract rules; provisional results are not final truth.</text><rect x="376" y="540" width="776" height="86" rx="12" fill="#F5B9420E" stroke="#F5B94255" stroke-width="1"/><text x="396" y="569" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#F7F9FC" text-anchor="start">Economic risk</text><text x="396" y="594" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Stake may be locked or slashed; rewards are uncertain; testnet assets have no monetary value.</text><rect x="376" y="642" width="776" height="86" rx="12" fill="#9B8AFB0E" stroke="#9B8AFB55" stroke-width="1"/><text x="396" y="671" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#F7F9FC" text-anchor="start">External dependencies</text><text x="396" y="696" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Wallets, RPCs, IPFS gateways and explorers remain separately operated third-party services.</text><text x="376" y="770" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#9AA7BD" text-anchor="start">No acceptance control is enabled until the approved legal version is published.</text><rect x="1208" y="258" width="328" height="580" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="1234" y="304" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="760" fill="#F7F9FC" text-anchor="start">Required review</text><circle cx="1244" cy="346" r="6" fill="#F4B860"/><text x="1264" y="351" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Operator and eligibility</text><circle cx="1244" cy="394" r="6" fill="#F4B860"/><text x="1264" y="399" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Prohibited conduct</text><circle cx="1244" cy="442" r="6" fill="#F4B860"/><text x="1264" y="447" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Liability limitations</text><circle cx="1244" cy="490" r="6" fill="#F4B860"/><text x="1264" y="495" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Governing law</text><circle cx="1244" cy="538" r="6" fill="#F4B860"/><text x="1264" y="543" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Dispute mechanism</text><circle cx="1244" cy="586" r="6" fill="#F4B860"/><text x="1264" y="591" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Suspension rules</text><circle cx="1244" cy="634" r="6" fill="#F4B860"/><text x="1264" y="639" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Version acceptance</text><rect x="1234" y="714" width="150" height="28" rx="14" fill="#FF6B7A1F" stroke="#FF6B7A66" stroke-width="1"/><text x="1309" y="733" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FF6B7A" text-anchor="middle">Publication blocked</text><rect x="1234" y="762" width="164" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="1316" y="790" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Risk disclosures</text><rect x="0" y="934" width="1600" height="66" fill="#0C111C"/><text x="64" y="973" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#9AA7BD" text-anchor="start">TruthBounty V2 · Optimism/EVM · Design authority</text><text x="1080" y="973" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#9AA7BD" text-anchor="start">Docs   Status   Contact   Privacy   Terms   Disclosures</text></svg>