>Stake and rewards</text><text x="590" y="354" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Stake can be locked or slashed;</text><text x="590" y="375" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">rewards are not guaranteed.</text><rect x="590" y="412" width="80" height="28" rx="14" fill="#F5B9421F" stroke="#F5B94266" stroke-width="1"/><text x="630" y="431" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F5B942" text-anchor="middle">Economic</text><rect x="1076" y="266" width="474" height="192" rx="16" fill="#101522" stroke="#273149" stroke-width="1"/><rect x="1096" y="286" width="42" height="42" rx="12" fill="#4F7CFF18" stroke="#4F7CFF55" stroke-width="1"/><text x="1117" y="313" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#4F7CFF" text-anchor="middle">F</text><text x="1154" y="306" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="760" fill="#F7F9FC" text-anchor="start">Finality and reorgs</text><text x="1096" y="354" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Confirmation can be replaced;</text><text x="1096" y="375" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">finality and indexing differ.</text><rect x="1096" y="412" width="74" height="28" rx="14" fill="#4F7CFF1F" stroke="#4F7CFF66" stroke-width="1"/><text x="1133" y="431" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#4F7CFF" text-anchor="middle">Chain</text><rect x="64" y="490" width="474" height="192" rx="16" fill="#101522" stroke="#273149" stroke-width="1"/><rect x="84" y="510" width="42" height="42" rx="12" fill="#22D3EE18" stroke="#22D3EE55" stroke-width="1"/><text x="105" y="537" font-family="