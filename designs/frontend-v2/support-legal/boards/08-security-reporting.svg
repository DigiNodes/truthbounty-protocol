<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Security and vulnerability reporting"><defs><linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#4F7CFF"/></linearGradient><radialGradient id="glow"><stop stop-color="#4F7CFF" stop-opacity=".16"/><stop offset="1" stop-color="#070A12" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="1000" fill="#070A12"/><circle cx="1420" cy="170" r="300" fill="url(#glow)"/><rect width="1600" height="88" fill="#0C111C"/><g transform="translate(46 24)"><path fill="url(#signal)" d="M22 0 7 5c-2 1-3 2-3 4v12c0 12 6 22 18 27V29l-8-8 8-8V0Zm4 0 15 5c2 1 3 2 3 4v12c0 12-6 22-18 27V29l8-8-8-8V0Z"/><path fill="#22D3EE" d="m24 17 4 4-4 4-4-4 4-4Z"/><text x="78" y="31" font-family="Geist, Inter, Arial, sans-serif" font-size="19" font-weight="820" fill="#F7F9FC" text-anchor="start">TruthBounty</text></g><text x="930" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">Explore</text><text x="1040" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">How it works</text><text x="1150" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#22D3EE" text-anchor="start">Docs</text><text x="1260" y="52" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">Status</text><rect x="1370" y="22" width="170" height="44" rx="10" fill="#4F7CFF" stroke="#4F7CFF" stroke-width="1"/><text x="1455" y="50" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Open app</text><text x="64" y="128" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#22D3EE" text-anchor="start">SECURITY</text><text x="64" y="176" font-family="Geist, Inter, Arial, sans-serif" font-size="34" font-weight="830" fill="#F7F9FC" text-anchor="start">Report a security vulnerability</text><text x="64" y="210" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#9AA7BD" text-anchor="start">Use responsible disclosure. Do not publish exploitable details or test against user assets.</text><rect x="64" y="254" width="710" height="586" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="92" y="296" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="780" fill="#F7F9FC" text-anchor="start">Accepted report scope</text><circle cx="102" cy="340" r="10" fill="#41D39A20" stroke="#41D39A"/><path d="m98 340 3 3 6-7" fill="none" stroke="#41D39A" stroke-width="2" stroke-linecap="round"/><text x="128" y="345" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Smart contracts and upgrade controls</text><circle cx="102" cy="388" r="10" fill="#41D39A20" stroke="#41D39A"/><path d="m98 388 3 3 6-7" fill="none" stroke="#41D39A" stroke-width="2" stroke-linecap="round"/><text x="128" y="393" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">API authorization and data integrity</text><circle cx="102" cy="436" r="10" fill="#41D39A20" stroke="#41D39A"/><path d="m98 436 3 3 6-7" fill="none" stroke="#41D39A" stroke-width="2" stroke-linecap="round"/><text x="128" y="441" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Frontend wallet and transaction safety</text><circle cx="102" cy="484" r="10" fill="#41D39A20" stroke="#41D39A"/><path d="m98 484 3 3 6-7" fill="none" stroke="#41D39A" stroke-width="2" stroke-linecap="round"/><text x="128" y="489" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Release artifacts and manifest validation</text><circle cx="102" cy="532" r="10" fill="#41D39A20" stroke="#41D39A"/><path d="m98 532 3 3 6-7" fill="none" stroke="#41D39A" stroke-width="2" stroke-linecap="round"/><text x="128" y="537" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Evidence privacy and secret exposure</text><text x="92" y="606" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="740" fill="#F7F9FC" text-anchor="start">Include</text><text x="92" y="638" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Affected release and component</text><text x="92" y="666" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Reproduction steps and impact</text><text x="92" y="694" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Non-destructive proof of concept</text><text x="92" y="722" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Suggested mitigation if known</text><rect x="92" y="770" width="194" height="28" rx="14" fill="#F4B8601F" stroke="#F4B86066" stroke-width="1"/><text x="189" y="789" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="middle">Protected channel pending</text><rect x="802" y="254" width="734" height="586" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="830" y="296" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="780" fill="#F7F9FC" text-anchor="start">Safety rules</text><rect x="830" y="326" width="678" height="92" rx="12" fill="#FF6B7A0E" stroke="#FF6B7A55" stroke-width="1"/><text x="850" y="355" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#F7F9FC" text-anchor="start">Do not test</text><text x="850" y="380" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">User funds, production data, denial of service, social engineering or credential access.</text><rect x="830" y="436" width="678" height="92" rx="12" fill="#FF6B7A0E" stroke="#FF6B7A55" stroke-width="1"/><text x="850" y="465" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="760" fill="#F7F9FC" text-anchor="start">Do not disclose</text><text x="850" y="490" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Seed phrases, private keys, tokens, private evidence, or live exploit details.</text><text x="830" y="574" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="740" fill="#F7F9FC" text-anchor="start">Current programme status</text><text x="830" y="610" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#9AA7BD" text-anchor="start">Security contact</text><text x="1508" y="610" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="end">Not formally published</text><line x1="830" y1="627" x2="1508" y2="627" stroke="#273149" stroke-width="1"/><text x="830" y="658" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#9AA7BD" text-anchor="start">Bug bounty</text><text x="1508" y="658" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="end">Not authorized</text><line x1="830" y1="675" x2="1508" y2="675" stroke="#273149" stroke-width="1"/><text x="830" y="706" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#9AA7BD" text-anchor="start">Response SLA</text><text x="1508" y="706" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="end">Not authorized</text><line x1="830" y1="723" x2="1508" y2="723" stroke="#273149" stroke-width="1"/><rect x="830" y="770" width="216" height="44" rx="10" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="938" y="798" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#9AA7BD" text-anchor="middle">Submission unavailable</text><text x="64" y="884" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#9AA7BD" text-anchor="start">Until a protected channel is approved, the UI must not solicit sensitive vulnerability details.</text><rect x="0" y="934" width="1600" height="66" fill="#0C111C"/><text x="64" y="973" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#9AA7BD" text-anchor="start">TruthBounty V2 · Optimism/EVM · Design authority</text><text x="1080" y="973" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#9AA7BD" text-anchor="start">Docs   Status   Contact   Privacy   Terms   Disclosures</text></svg>