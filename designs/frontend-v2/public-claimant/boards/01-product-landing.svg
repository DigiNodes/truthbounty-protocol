nter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F7F9FC" text-anchor="start">Submit a verifiable claim</text><text x="84" y="734" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">State exactly what can be supported or challenged.</text><text x="84" y="768" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#22D3EE" text-anchor="start">Public by default; actions gated.</text><rect x="564" y="648" width="468" height="160" rx="16" fill="#101522" stroke="#273149" stroke-width="1"/><rect x="584" y="668" width="38" height="38" rx="11" fill="#22D3EE16" stroke="#22D3EE44" stroke-width="1"/><text x="603" y="693" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#22D3EE" text-anchor="middle">02</text><text x="640" y="690" font-family="Geist, Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F7F9FC" text-anchor="start">Attach traceable evidence</text><text x="584" y="734" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Sources, integrity and freshness remain visible.</text><text x="584" y="768" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#22D3EE" text-anchor="start">Public by default; actions gated.</text><rect x="1064" y="648" width="468" height="160" rx="16" fill="#101522" stroke="#273149" stroke-width="1"/><rect x="1084" y="668" width="38" height="38" rx="11" fill="#4F7CFF16" stroke="#4F7CFF44" stroke-width="1"/><text x="1103" y="693" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#4F7CFF" text-anchor="middle">03</text><text x="1140" y="690" font-family="Geist, Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F7F9FC" text-anchor="start">Verify and resolve</text><text x="1084" y="734" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Canonical phases separate provisional from final.</text><text x="1084" y="768" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#41D39A" text-anchor="start">Finality is never inferred.</text><rect x="64" y="852" width="1472" height="92" rx="18" fill="url(#signal)" stroke="none" stroke-width="1"/><text x="92" y="888" font-family="Geist, Inter, Arial, sans-serif" font-size="20" font-weight="820" fill="#070A12" text-anchor="start">Ready to make a claim?</text><text x="92" y="918" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#070A12" text-anchor="start">Connect only when you choose an action. Public evidence stays open.</text><rect x="1322" y="876" width="174" height="44" rx="10" fill="#F5B942" stroke="#F5B942" stroke-width="1"/><text x="1409" y="904" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#070A12" text-anchor="middle">Create claim</text></svg>