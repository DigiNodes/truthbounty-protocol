<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Wallet entry and claimant eligibility"><defs><linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#4F7CFF"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity=".25"/></filter></defs><rect width="1600" height="1000" fill="#070A12"/><g transform="translate(64 42)"><path fill="url(#signal)" d="M22 0 7 5c-2 1-3 2-3 4v12c0 12 6 22 18 27V29l-8-8 8-8V0Zm4 0 15 5c2 1 3 2 3 4v12c0 12-6 22-18 27V29l8-8-8-8V0Z"/><path fill="#22D3EE" d="m24 17 4 4-4 4-4-4 4-4Z"/><text x="54" y="31" font-family="Geist, Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F7F9FC" text-anchor="start">TruthBounty</text></g><text x="1034" y="70" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#9AA7BD" text-anchor="start">Explore</text><text x="1114" y="70" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="650" fill="#9AA7BD" text-anchor="start">Disputes</text><text x="1204" y="70" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="650" fill="#9AA7BD" text-anchor="start">Treasury</text><text x="1294" y="70" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="650" fill="#9AA7BD" text-anchor="start">Docs</text><rect x="1370" y="43" width="150" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="1445" y="71" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Connect wallet</text><line x1="48" y1="102" x2="1552" y2="102" stroke="#273149" stroke-width="1"/><text x="64" y="154" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#22D3EE" text-anchor="start">Create a claim</text><text x="64" y="204" font-family="Geist, Inter, Arial, sans-serif" font-size="36" font-weight="820" fill="#F7F9FC" text-anchor="start">Connect only when you are ready to act.</text><text x="64" y="242" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#9AA7BD" text-anchor="start">Public browsing never requires a wallet. Claim creation validates account,</text><text x="64" y="266" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#9AA7BD" text-anchor="start">network, release and funding before any signature request.</text><rect x="64" y="326" width="762" height="520" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="92" y="368" font-family="Geist, Inter, Arial, sans-serif" font-size="17" font-weight="780" fill="#F7F9FC" text-anchor="start">Before you connect</text><rect x="92" y="408" width="38" height="38" rx="11" fill="#22D3EE16" stroke="#22D3EE44" stroke-width="1"/><text x="111" y="433" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#22D3EE" text-anchor="middle">1</text><text x="146" y="422" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="720" fill="#F7F9FC" text-anchor="start">Your wallet stays self-custodied</text><text x="146" y="446" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">TruthBounty never asks for a seed phrase.</text><rect x="92" y="502" width="38" height="38" rx="11" fill="#74A7FF16" stroke="#74A7FF44" stroke-width="1"/><text x="111" y="527" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#74A7FF" text-anchor="middle">2</text><text x="146" y="516" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="720" fill="#F7F9FC" text-anchor="start">The network is pinned</text><text x="146" y="540" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Mutations use the approved Optimism release only.</text><rect x="92" y="596" width="38" height="38" rx="11" fill="#22D3EE16" stroke="#22D3EE44" stroke-width="1"/><text x="111" y="621" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#22D3EE" text-anchor="middle">3</text><text x="146" y="610" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="720" fill="#F7F9FC" text-anchor="start">Connection is not authorization</text><text x="146" y="634" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Each transaction receives a separate review.</text><rect x="92" y="690" width="38" height="38" rx="11" fill="#22D3EE16" stroke="#22D3EE44" stroke-width="1"/><text x="111" y="715" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#22D3EE" text-anchor="middle">4</text><text x="146" y="704" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="720" fill="#F7F9FC" text-anchor="start">Drafts are recoverable</text><text x="146" y="728" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Local unsent work is labelled and never called canonical.</text><rect x="92" y="788" width="180" height="44" rx="10" fill="#4F7CFF" stroke="#4F7CFF" stroke-width="1"/><text x="182" y="816" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Connect wallet</text><rect x="858" y="326" width="678" height="242" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="886" y="366" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#9AA7BD" text-anchor="start">Eligibility preview</text><rect x="886" y="390" width="108" height="28" rx="14" fill="#9AA7BD1F" stroke="#9AA7BD55" stroke-width="1"/><text x="940" y="409" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#9AA7BD" text-anchor="middle">Public visitor</text><text x="886" y="444" font-family="Geist, Inter, Arial, sans-serif" font-size="17" font-weight="760" fill="#F7F9FC" text-anchor="start">Claim creation unavailable until checked</text><text x="886" y="476" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Account · chain · release · claimant capability</text><rect x="886" y="506" width="166" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="969" y="534" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Why is this gated?</text><rect x="858" y="594" width="678" height="252" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="886" y="634" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="750" fill="#F7F9FC" text-anchor="start">Supported environment</text><rect x="886" y="660" width="146" height="28" rx="14" fill="#74A7FF1F" stroke="#74A7FF55" stroke-width="1"/><text x="959" y="679" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#74A7FF" text-anchor="middle">Optimism Sepolia</text><rect x="1044" y="660" width="124" height="28" rx="14" fill="#22D3EE1F" stroke="#22D3EE55" stroke-width="1"/><text x="1106" y="679" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#22D3EE" text-anchor="middle">Release TB-V2</text><line x1="886" y1="708" x2="1508" y2="708" stroke="#273149" stroke-width="1"/><text x="886" y="742" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#9AA7BD" text-anchor="start">Wrong network</text><text x="1508" y="742" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="650" fill="#F4B860" text-anchor="end">Mutation disabled · public reads remain</text><text x="886" y="780" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#9AA7BD" text-anchor="start">Missing release manifest</text><text x="1508" y="780" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="650" fill="#FF6B7A" text-anchor="end">Fail closed · open status</text></svg>