, bounded and evidence-ready.</text><circle cx="324" cy="258" r="12" fill="#22D3EE" stroke="#22D3EE" stroke-width="1"/><text x="346" y="263" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F7F9FC" text-anchor="start">Claim</text><line x1="406" y1="258" x2="500" y2="258" stroke="#273149" stroke-width="1"/><circle cx="534" cy="258" r="12" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="556" y="263" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Evidence</text><line x1="616" y1="258" x2="710" y2="258" stroke="#273149" stroke-width="1"/><circle cx="744" cy="258" r="12" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="766" y="263" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Funding</text><line x1="826" y1="258" x2="920" y2="258" stroke="#273149" stroke-width="1"/><circle cx="954" cy="258" r="12" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="976" y="263" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Review</text><rect x="312" y="304" width="828" height="548" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="340" y="350" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F7F9FC" text-anchor="start">Claim title</text><rect x="340" y="362" width="772" height="48" rx="10" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="356" y="392" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">Enter a concise, verifiable statement</text><text x="340" y="430" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">140 characters maximum</text><text x="340" y="454" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F7F9FC" text-anchor="start">Category</text><rect x="340" y="466" width="368" height="48" rx="10" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="356" y="496" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">Select a category</text><text x="734" y="454" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F7F9FC" text-anchor="start">Geographic scope</text><rect x="734" y="466" width="378" height="48" rx="10" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="750" y="496" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">Global, country or locality</text><text x="340" y="556" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F7F9FC" text-anchor="start">Context and verification criteria</text><rect x="340" y="568" width="772" height="132" rx="10" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="356" y="596" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#9AA7BD" text-anchor="start">Explain the timeframe, measurable assertion and what evidence</text><text x="356" y="620" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#9AA7BD" text-anchor="start">would support or contradict it.</text><rect x="340" y="724" width="772" height="72" rx="12" fill="#74A7FF0D" stroke="#74A7FF55" stroke-width="1"/><rect x="356" y="741" width="38" height="38" rx="11" fill="#74A7FF16" stroke="#74A7FF44" stroke-width="1"/><text x="375" y="766" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#74A7FF" text-anchor="middle">i</text><text x="406" y="752" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="750" fill="#F7F9FC" text-anchor="start">Canonical boundary</text><text x="406" y="774" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">This local draft has not been submitted on-chain.</text><rect x="340" y="814" width="136" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="408" y="842" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Save and exit</text><rect x="946" y="814" width="166" height="44" rx="10" fill="#4F7CFF" stroke="#4F7CFF" stroke-width="1"/><text x="1029" y="842" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Continue to evidence</text><rect x="1170" y="304" width="366" height="548" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="1196" y="344" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="750" fill="#F7F9FC" text-anchor="start">A strong claim is</text><text x="1196" y="382" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Specific — one testable assertion</text><text x="1196" y="426" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Bounded — time and place are clear</text><text x="1196" y="470" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Neutral — no outcome is implied</text><text x="1196" y="514" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Traceable — sources can be inspected</text><line x1="1196" y1="566" x2="1510" y2="566" stroke="#273149" stroke-width="1"/><text x="1196" y="604" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="750" fill="#FF6B7A" text-anchor="start">Avoid</text><text x="1196" y="634" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Opinion presented as fact</text><text x="1196" y="674" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Multiple unrelated assertions</text><text x="1196" y="714" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Private or unsafe evidence</text><text x="1196" y="754" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Claims without a verification path</text><rect x="1196" y="806" width="118" height="28" rx="14" fill="#9AA7BD1F" stroke="#9AA7BD55" stroke-width="1"/><text x="1255" y="825" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#9AA7BD" text-anchor="middle">Local draft only</text></svg>