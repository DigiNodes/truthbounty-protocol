ight="820" fill="#F7F9FC" text-anchor="start">Prepare a governed change</text><text x="312" y="208" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#9AA7BD" text-anchor="start">Only registered targets and allowlisted selectors may enter the proposal package.</text><rect x="312" y="252" width="800" height="600" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="338" y="292" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="780" fill="#F7F9FC" text-anchor="start">Change definition</text><text x="338" y="338" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#9AA7BD" text-anchor="start">Registered module</text><text x="1086" y="338" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F7F9FC" text-anchor="end">VerificationConfig · 0x8e…32</text><line x1="338" y1="355" x2="1086" y2="355" stroke="#273149" stroke-width="1"/><text x="338" y="386" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#9AA7BD" text-anchor="start">Permitted action</text><text x="1086" y="386" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#22D3EE" text-anchor="end">setVerificationThreshold(uint256)</text><line x1="338" y1="403" x2="1086" y2="403" stroke="#273149" stroke-width="1"/><text x="338" y="434" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#9AA7BD" text-anchor="start">Current value</text><text x="1086" y="434" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F7F9FC" text-anchor="end">67%</text><line x1="338" y1="451" x2="1086" y2="451" stroke="#273149" stroke-width="1"/><text x="338" y="482" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#9AA7BD" text-anchor="start">Proposed value</text><text x="1086" y="482" font-family="Geist, Inter, Arial, sans-serif" font-siz