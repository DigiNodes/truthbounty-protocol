/><text x="1168" y="606" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="750" fill="#F7F9FC" text-anchor="start">Authority boundary</text><text x="1168" y="642" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Preparing a proposal does not execute it.</text><text x="1168" y="670" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">Voting, queueing and timelock remain</text><text x="1168" y="698" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#9AA7BD" text-anchor="start">separate canonical steps.</text><rect x="1168" y="756" width="140" height="28" rx="14" fill="#FF6B7A1F" stroke="#FF6B7A55" stroke-width="1"/><text x="1238" y="775" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FF6B7A" text-anchor="middle">No arbitrary calls</text></svg>