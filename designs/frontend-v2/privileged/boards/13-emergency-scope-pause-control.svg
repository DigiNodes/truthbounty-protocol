ext-anchor="start">Guardian</text><text x="54" y="405" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">Audit trail</text><line x1="30" y1="494" x2="242" y2="494" stroke="#273149" stroke-width="1"/><text x="54" y="534" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">Public application</text><text x="54" y="580" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#9AA7BD" text-anchor="start">Service status</text><rect x="30" y="900" width="154" height="28" rx="14" fill="#4F7CFF1F" stroke="#4F7CFF55" stroke-width="1"/><text x="107" y="919" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#4F7CFF" text-anchor="middle">Optimism Sepolia</text><text x="30" y="948" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">TB-V2 · authority revalidated</text><rect x="272" width="1328" height="88" fill="#101522"/><text x="312" y="54" font-family="Geist, Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#F7F9FC" text-anchor="start">Guardian</text><rect x="1230" y="30" width="178" height="28" rx="14" fill="#F4B8601F" stroke="#F4B86055" stroke-width="1"/><text x="1319" y="49" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="middle">Emergency guardian</text><rect x="1420" y="30" width="104" height="28" rx="14" fill="#41D39A1F" stroke="#41D39A55" stroke-width="1"/><text x="1472" y="49" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#41D39A" text-anchor="middle">0x71…c2</text><text x="312" y="132" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="750" fill="#F4B860" text-anchor="start">Emergency guardian</text><text x="312" y="176" font-family="Geist, Inter, Arial, sans-serif" font-size="32" font-weight="820" fill="#F7F9FC" text-anchor="start">Emergency scope and pause control</text><text x="312" y="208" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#9AA7BD" text-anchor="start">Guardian authority is operation-scoped, narrow, and never implies recovery authority.</text><rect x="1340" y="146" width="104" height="28" rx="14" fill="#F4B8601F" stroke="#F4B86055" stroke-width="1"/><text x="1392" y="165" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="middle">Restricted</text><rect x="312" y="252" width="790" height="600" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="338" y="292" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="780" fill="#F7F9FC" text-anchor="start">Authorized emergency surfaces</text><rect x="338" y="322" width="738" height="78" rx="12" fill="#0C111C" stroke="#273149" stroke-width="1"/><rect x="354" y="336" width="100" height="28" rx="14" fill="#F4B8601F" stroke="#F4B86055" stroke-width="1"/><text x="404" y="355" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="middle">Veto</text><text x="470" y="351" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#F7F9FC" text-anchor="start">Governance proposal TBP-108</text><text x="470" y="375" font-family="Geist, Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#9AA7BD" text-anchor="start">Canonical cancel path · non-terminal proposal</text><rect x="928" y="347" width="122" height="28" rx="14" fill="#F4B8601F" stroke="#F4B86055" stroke-width="1"/><text x="989" y="366" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="middle">Available</text><rect x="338" y="416" width="738" height="78" rx="12" fill="#0C111C" stroke="#273149" stroke-width="1"/><rect x="354" y="430" width="100" height="28" rx="14" fill="#F4B8601F" stroke="#F4B86055" stroke-width="1"/><text x="404" y="449" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="middle">Request</text><text x="470" y="445" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#F7F9FC" text-anchor="start">Settlement module pause</text><text x="470" y="469" font-family="Geist, Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#9AA7BD" text-anchor="start">Emits request event; does not call module</text><rect x="928" y="441" width="122" height="28" rx="14" fill="#F4B8601F" stroke="#F4B86055" stroke-width="1"/><text x="989" y="460" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="middle">Request only</text><rect x="338" y="510" width="738" height="78" rx="12" fill="#0C111C" stroke="#273149" stroke-width="1"/><rect x="354" y="524" width="100" height="28" rx="14" fill="#F4B8601F" stroke="#F4B86055" stroke-width="1"/><text x="404" y="543" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="middle">Circuit</text><text x="470" y="539" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#F7F9FC" text-anchor="start">Guardian contract pause</text><text x="470" y="563" font-family="Geist, Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#9AA7BD" text-anchor="start">Does not pause governed modules</text><rect x="928" y="535" width="122" height="28" rx="14" fill="#F4B8601F" stroke="#F4B86055" stroke-width="1"/><text x="989" y="554" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="middle">Available</text><rect x="338" y="608" width="738" height="76" rx="12" fill="#FF6B7A0E" stroke="#FF6B7A55" stroke-width="1"/><text x="358" y="637" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="750" fill="#F7F9FC" text-anchor="start">Critical distinction</text><text x="358" y="662" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">A pause request event is not a successful module pause. The UI says exactly which occurred.</text><text x="338" y="716" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F7F9FC" text-anchor="start">Incident reference</text><rect x="338" y="732" width="738" height="48" rx="10" fill="#0C111C" stroke="#273149" stroke-width="1"/><text x="354" y="762" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#F7F9FC" text-anchor="start">INC-208 · suspected verification module fault</text><rect x="338" y="804" width="218" height="44" rx="10" fill="#FF6B7A" stroke="#FF6B7A" stroke-width="1"/><text x="447" y="832" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#F7F9FC" text-anchor="middle">Review scoped action</text><rect x="1130" y="252" width="406" height="600" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="1158" y="292" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="750" fill="#F7F9FC" text-anchor="start">Never granted here</text><circle cx="1168" cy="336" r="6" fill="#FF6B7A"/><text x="1192" y="341" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Unpause governed modules</text><circle cx="1168" cy="379" r="6" fill="#FF6B7A"/><text x="1192" y="384" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Execute governance proposals</text><circle cx="1168" cy="422" r="6" fill="#FF6B7A"/><text x="1192" y="427" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Upgrade implementations</text><circle cx="1168" cy="465" r="6" fill="#FF6B7A"/><text x="1192" y="470" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Move treasury or user funds</text><circle cx="1168" cy="508" r="6" fill="#FF6B7A"/><text x="1192" y="513" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Settle claims or disputes</text><circle cx="1168" cy="551" r="6" fill="#FF6B7A"/><text x="1192" y="556" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Administer roles</text><line x1="1158" y1="608" x2="1508" y2="608" stroke="#273149" stroke-width="1"/><text x="1158" y="646" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F7F9FC" text-anchor="start">Authorization sequence</text><text x="1158" y="680" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Confirm exact scope</text><text x="1158" y="712" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Show impact and reversibility</text><text x="1158" y="744" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Revalidate guardian role</text><text x="1158" y="776" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Simulate canonical call</text><text x="1158" y="808" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="550" fill="#9AA7BD" text-anchor="start">Record transaction or request event</text><rect x="1158" y="810" width="158" height="28" rx="14" fill="#FF6B7A1F" stroke="#FF6B7A55" stroke-width="1"/><text x="1237" y="829" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FF6B7A" text-anchor="middle">No implied unpause</text></svg>