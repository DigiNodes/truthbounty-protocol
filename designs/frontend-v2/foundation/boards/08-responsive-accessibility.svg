 x="64" y="724" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#9AA7BD" text-anchor="start">RESPONSIVE RULES</text><rect x="64" y="748" width="468" height="78" rx="14" fill="#101522" stroke="#273149" stroke-width="1"/><circle cx="86" cy="787" r="11" fill="#22D3EE20" stroke="#22D3EE"/><path d="m81 787 3 4 7-8" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="779" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="750" fill="#F7F9FC" text-anchor="start">200% zoom</text><text x="112" y="801" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">No clipped controls or lost journeys</text><rect x="556" y="748" width="468" height="78" rx="14" fill="#101522" stroke="#273149" stroke-width="1"/><circle cx="578" cy="787" r="11" fill="#22D3EE20" stroke="#22D3EE"/><path d="m573 787 3 4 7-8" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="604" y="779" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="750" fill="#F7F9FC" text-anchor="start">44 × 44 px</text><text x="604" y="801" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Minimum touch target</text><rect x="1048" y="748" width="468" height="78" rx="14" fill="#101522" stroke="#273149" stroke-width="1"/><circle cx="1070" cy="787" r="11" fill="#22D3EE20" stroke="#22D3EE"/><path d="m1065 787 3 4 7-8" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1096" y="779" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="750" fill="#F7F9FC" text-anchor="start">Keyboard</text><text x="1096" y="801" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Logical order and visible focus</text><rect x="64" y="844" width="468" height="78" rx="14" fill="#101522" stroke="#273149" stroke-width="1"/><circle cx="86" cy="883" r="11" fill="#22D3EE20" stroke="#22D3EE"/><path d="m81 883 3 4 7-8" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="875" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="750" fill="#F7F9FC" text-anchor="start">Screen reader</text><text x="112" y="897" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Landmarks, names and status announcements</text><rect x="556" y="844" width="468" height="78" rx="14" fill="#101522" stroke="#273149" stroke-width="1"/><circle cx="578" cy="883" r="11" fill="#22D3EE20" stroke="#22D3EE"/><path d="m573 883 3 4 7-8" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="604" y="875" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="750" fill="#F7F9FC" text-anchor="start">Reduced motion</text><text x="604" y="897" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">No essential meaning in animation</text><rect x="1048" y="844" width="468" height="78" rx="14" fill="#101522" stroke="#273149" stroke-width="1"/><circle cx="1070" cy="883" r="11" fill="#74A7FF20" stroke="#74A7FF"/><path d="m1065 883 3 4 7-8" fill="none" stroke="#74A7FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1096" y="875" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="750" fill="#F7F9FC" text-anchor="start">Tables → cards</text><text x="1096" y="897" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Mobile preserves priority, not columns</text></svg>