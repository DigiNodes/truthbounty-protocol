<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Wallet, network and identity">
<defs><linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#4F7CFF"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".22"/></filter></defs>
<rect width="1600" height="1000" fill="#070A12"/><circle cx="150" cy="-40" r="280" fill="#22D3EE" opacity=".035"/><circle cx="1550" cy="980" r="340" fill="#4F7CFF" opacity=".045"/><text x="64" y="54" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#22D3EE" text-anchor="start">FOUNDATION 05</text><text x="64" y="96" font-family="Geist, Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#F7F9FC" text-anchor="start">Wallet, network and identity</text><text x="64" y="126" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="450" fill="#9AA7BD" text-anchor="start">Connection is not authorization; every protected action revalidates canonical authority.</text><g transform="translate(1422 46)"><path fill="url(#signal)" d="M24 2 8 7c-2 1-3 2-3 4v13c0 13 6 23 19 29V32l-9-9 9-9V2Zm4 0 16 5c2 1 3 2 3 4v13c0 13-6 23-19 29V32l9-9-9-9V2Z"/><path fill="#22D3EE" d="m26 19 4 4-4 4-4-4 4-4Z"/><text x="55" y="34" font-family="Geist, Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F7F9FC" text-anchor="start">TruthBounty</text></g><rect x="64" y="176" width="456" height="300" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><rect x="88" y="200" width="36" height="36" rx="10" fill="#22D3EE18" stroke="#22D3EE44" stroke-width="1"/><text x="106" y="223" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#22D3EE" text-anchor="middle">WA</text><text x="140" y="224" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#F7F9FC" text-anchor="start">Wallet account</text><rect x="88" y="244" width="96" height="28" rx="14" fill="#41D39A1F" stroke="#41D39A55" stroke-width="1"/><text x="136" y="263" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#41D39A" text-anchor="middle">Connected</text><text x="88" y="292" font-family="Geist Mono, monospace" font-size="18" font-weight="750" fill="#F7F9FC" text-anchor="start">0x71f3…c2A9</text><text x="88" y="322" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Claimant · Verifier eligible</text><line x1="88" y1="346" x2="496" y2="346" stroke="#273149" stroke-width="1" /><rect x="88" y="368" width="124" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="150" y="396" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#F7F9FC" text-anchor="middle">View account</text><rect x="224" y="368" width="112" height="44" rx="10" fill="transparent" stroke="#273149" stroke-width="1"/><text x="280" y="396" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#F7F9FC" text-anchor="middle">Disconnect</text><rect x="548" y="176" width="456" height="300" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><rect x="572" y="200" width="36" height="36" rx="10" fill="#F4B86018" stroke="#F4B86044" stroke-width="1"/><text x="590" y="223" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#F4B860" text-anchor="middle">NE</text><text x="624" y="224" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#F7F9FC" text-anchor="start">Network boundary</text><rect x="572" y="244" width="118" height="28" rx="14" fill="#F4B8601F" stroke="#F4B86055" stroke-width="1"/><text x="631" y="263" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4B860" text-anchor="middle">Wrong network</text><text x="572" y="292" font-family="Geist, Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#F7F9FC" text-anchor="start">Mutations are unavailable.</text><text x="572" y="322" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Switch to the pinned Optimism release.</text><rect x="572" y="350" width="408" height="44" rx="10" fill="#F4B86010" stroke="#F4B86055" stroke-width="1"/><text x="590" y="378" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#F4B860" text-anchor="start">Public reads remain available where safe.</text><rect x="572" y="410" width="142" height="44" rx="10" fill="#4F7CFF" stroke="#4F7CFF" stroke-width="1"/><text x="643" y="438" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#F7F9FC" text-anchor="middle">Switch network</text><rect x="1032" y="176" width="456" height="300" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><rect x="1056" y="200" width="36" height="36" rx="10" fill="#74A7FF18" stroke="#74A7FF44" stroke-width="1"/><text x="1074" y="223" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#74A7FF" text-anchor="middle">ID</text><text x="1108" y="224" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#F7F9FC" text-anchor="start">Identity and trust</text><rect x="1056" y="244" width="138" height="28" rx="14" fill="#74A7FF1F" stroke="#74A7FF55" stroke-width="1"/><text x="1125" y="263" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#74A7FF" text-anchor="middle">Evidence available</text><text x="1056" y="292" font-family="Geist, Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#F7F9FC" text-anchor="start">Humanity evidence</text><text x="1056" y="322" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="550" fill="#9AA7BD" text-anchor="start">Verified source · freshness labelled</text><line x1="1056" y1="346" x2="1464" y2="346" stroke="#273149" stroke-width="1" /><text x="1056" y="378" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="650" fill="#F4B860" text-anchor="start">Identity does not create protocol authority.</text><rect x="1056" y="410" width="138" height="44" rx="10" fill="#151C2B" stroke="#273149" stroke-width="1"/><text x="1125" y="438" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#F7F9FC" text-anchor="middle">Review evidence</text><rect x="64" y="510" width="1472" height="378" rx="18" fill="#101522" stroke="#273149" stroke-width="1"/><text x="90" y="548" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#9AA7BD" text-anchor="start">SESSION AND AUTHORITY INVALIDATION</text><rect x="90" y="580" width="330" height="132" rx="14" fill="#070A12" stroke="#273149" stroke-width="1"/><text x="108" y="612" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#22D3EE" text-anchor="start">01</text><text x="108" y="642" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="750" fill="#F7F9FC" text-anchor="start">Account changed</text><text x="108" y="668" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Discard stale protected context</text><text x="430" y="648" font-family="Geist, Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#9AA7BD" text-anchor="start">→</text><rect x="446" y="580" width="330" height="132" rx="14" fill="#070A12" stroke="#273149" stroke-width="1"/><text x="464" y="612" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#22D3EE" text-anchor="start">02</text><text x="464" y="642" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="750" fill="#F7F9FC" text-anchor="start">Chain changed</text><text x="464" y="668" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Revalidate pinned release</text><text x="786" y="648" font-family="Geist, Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#9AA7BD" text-anchor="start">→</text><rect x="802" y="580" width="330" height="132" rx="14" fill="#070A12" stroke="#273149" stroke-width="1"/><text x="820" y="612" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#22D3EE" text-anchor="start">03</text><text x="820" y="642" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="750" fill="#F7F9FC" text-anchor="start">Manifest changed</text><text x="820" y="668" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Refresh ABI, roles and addresses</text><text x="1142" y="648" font-family="Geist, Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#9AA7BD" text-anchor="start">→</text><rect x="1158" y="580" width="330" height="132" rx="14" fill="#070A12" stroke="#273149" stroke-width="1"/><text x="1176" y="612" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#22D3EE" text-anchor="start">04</text><text x="1176" y="642" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="750" fill="#F7F9FC" text-anchor="start">Role revoked</text><text x="1176" y="668" font-family="Geist, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#9AA7BD" text-anchor="start">Remove action and show denied state</text><rect x="90" y="744" width="1400" height="104" rx="14" fill="#FF6B7A0D" stroke="#FF6B7A44" stroke-width="1"/><text x="112" y="780" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#FF6B7A" text-anchor="start">FAIL CLOSED</text><text x="112" y="808" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#F7F9FC" text-anchor="start">Missing, stale, contradictory or unmapped authority disables protected mutation. Frontend context never grants capability.</text><rect x="1350" y="780" width="116" height="28" rx="14" fill="#FF6B7A1F" stroke="#FF6B7A55" stroke-width="1"/><text x="1408" y="799" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FF6B7A" text-anchor="middle">Required</text></svg>